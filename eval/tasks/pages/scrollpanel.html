<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Registration</title>
<link rel="stylesheet" href="task.css">
<style>html,body{height:100%;overflow:hidden}
.panel{height:560px;overflow-y:auto;border:1px solid #e3e6ec;border-radius:12px;background:#fff;padding:0 20px 20px}
.intro{height:640px;color:#586174;line-height:1.7}</style>
</head><body>
<header><b>Space Applications Centre</b><small>Internship registration</small></header>
<main><div class="panel" id="panel"><form id="form" onsubmit="window.__submitted = true; return false">
  <div class="intro"><h2>Before you begin</h2>
    <p>Read the eligibility notes in full. Internships run for eight to twelve weeks at the
    centre, and every applicant is interviewed. The form continues below this note.</p></div>
  <label for="r1">Full name</label><input type="text" id="r1" autocomplete="name">
  <label for="r2">Email</label><input type="email" id="r2" autocomplete="email">
  <label for="r3">Mobile number</label><input type="tel" id="r3" autocomplete="tel">
  <label for="r4">PIN code</label><input type="text" id="r4" autocomplete="postal-code">
  <label for="r5">PAN</label><input type="text" id="r5">
  <button type="submit">Register</button>
</form></div></main></body></html>
