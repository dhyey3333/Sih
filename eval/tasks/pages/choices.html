<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scholarship — personal details</title>
<link rel="stylesheet" href="task.css"></head><body>
<header><b>Post-Matric Scholarship Portal</b><small>Step 1 · Personal details</small></header>
<main><form class="card" id="form" onsubmit="window.__submitted = true; return false">
  <h2>Personal details</h2>
  <label for="name">Full name <span class="req">*</span></label>
  <input type="text" id="name" name="applicant_name" autocomplete="name" required>
  <label for="dob">Date of birth <span class="req">*</span></label>
  <input type="date" id="dob" name="dob" required>
  <fieldset><legend class="note">Gender <span class="req">*</span></legend>
    <label><input type="radio" name="gender" value="female" required> Female</label>
    <label><input type="radio" name="gender" value="male"> Male</label>
    <label><input type="radio" name="gender" value="other"> Other</label>
  </fieldset>
  <label for="state">State of domicile <span class="req">*</span></label>
  <select id="state" name="state" required>
    <option value="">Select state</option><option>Karnataka</option><option>Kerala</option>
    <option>Maharashtra</option><option>Tamil Nadu</option><option>Uttar Pradesh</option>
  </select>
  <label for="mobile">Mobile number <span class="req">*</span></label>
  <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>
  <button type="submit">Submit application</button>
</form></main></body></html>
