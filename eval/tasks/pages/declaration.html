<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Declaration</title>
<link rel="stylesheet" href="task.css"></head><body>
<header><b>Post-Matric Scholarship Portal</b><small>Final step · Declaration</small></header>
<main><form class="card" id="form" onsubmit="window.__submitted = true; return false">
  <h2>Declaration</h2>
  <label for="nm">Applicant name</label><input type="text" id="nm" autocomplete="name">
  <label for="em">Email</label><input type="email" id="em" autocomplete="email">
  <label class="check"><input type="checkbox" id="agree" required>
    I declare that the information given above is true to the best of my knowledge.</label>
  <label class="check"><input type="checkbox" id="news"> Send me updates about other schemes</label>
  <button type="submit">Submit application</button>
</form></main></body></html>
