<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Embedded form</title>
<link rel="stylesheet" href="task.css"></head><body>
<header><b>District e-Office</b><small>The form below is hosted in a frame</small></header>
<main><div class="card"><h2>Grievance registration</h2>
  <iframe id="host" title="Registration form" style="width:100%;height:300px;border:1px solid #d8dee8;border-radius:6px"
    srcdoc='<link rel="stylesheet" href="task.css"><form style="padding:4px 12px" onsubmit="parent.__submitted = true; return false">
      <label for="n">Full name</label><input type="text" id="n" autocomplete="name">
      <label for="e">Email address</label><input type="email" id="e" autocomplete="email">
      <label for="m">Mobile number</label><input type="tel" id="m" autocomplete="tel">
      <button type="submit">Register grievance</button></form>'></iframe>
</div></main></body></html>
