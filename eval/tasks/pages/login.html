<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<link rel="stylesheet" href="task.css"></head><body>
<header><b>e-Services Login</b><small>Sign in to continue</small></header>
<main><form class="card" id="form" onsubmit="window.__submitted = true; return false">
  <h2>Sign in</h2>
  <label for="user">Email address</label><input type="email" id="user" autocomplete="username">
  <label for="pass">Password</label><input type="password" id="pass" autocomplete="current-password">
  <label><input type="checkbox" id="remember"> Keep me signed in</label>
  <button type="submit">Sign in</button>
</form></main></body></html>
