<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Demo Signup - Vision Agent Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    img { margin-top: 12px; border-radius: 8px; }
    button { margin-top: 20px; padding: 10px 16px; width: 100%; }
  </style>
</head>
<body>
  <h2>Create your account</h2>

  <img src="https://placehold.co/120x120" alt="profile photo" width="120" height="120" id="profile-photo" />

  <label for="full-name">Full name</label>
  <input type="text" id="full-name" name="full_name" />

  <label for="email">Email</label>
  <input type="email" id="email" name="email" />

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" />

  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="new-password" />

  <label for="card-number">Card number (for premium plan, optional)</label>
  <input type="text" id="card-number" name="card_number" autocomplete="cc-number" />

  <button id="submit-btn" type="button" aria-label="Submit signup form">Sign up</button>

  <script>
    document.getElementById("submit-btn").addEventListener("click", () => {
      alert("Form submitted (demo - nothing is actually sent anywhere).");
    });
  </script>
</body>
</html>
