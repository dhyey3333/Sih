<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 380px;
      font-family: -apple-system, system-ui, sans-serif;
      padding: 14px;
      background: #0f1115;
      color: #e6e6e6;
    }
    h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px;
      background: #1a1d24; border: 1px solid #2a2e38; color: #e6e6e6; border-radius: 6px;
    }
    button {
      width: 100%; padding: 9px; cursor: pointer; border: none; border-radius: 6px;
      background: #4f7cff; color: white; font-weight: 600;
    }
    button:hover { background: #3d67e0; }
    button:disabled { background: #2a2e38; cursor: not-allowed; }

    .badge {
      display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px;
      font-weight: 700; text-transform: uppercase;
    }
    .badge-vlm { background: #1e4d2b; color: #6fe08a; }
    .badge-rule { background: #4d3d1e; color: #e0c26f; }

    #dashboard { margin-top: 12px; display: none; }
    .metrics-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
      background: #1a1d24; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 12px;
    }
    .metric-label { color: #9099ab; }
    .metric-value { font-weight: 600; text-align: right; }

    #steps { max-height: 220px; overflow-y: auto; }
    .step {
      background: #1a1d24; border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 12px;
    }
    .step-reasoning { color: #c8cdda; margin-bottom: 3px; }
    .step-action { color: #6fa8ff; font-family: monospace; font-size: 11px; }

    #preview { margin-top: 10px; }
    #preview img { width: 100%; border-radius: 6px; border: 1px solid #2a2e38; }
    #preview-label { font-size: 10px; color: #9099ab; margin-top: 4px; }
  </style>
</head>
<body>
  <h3>🔒 Privacy-Preserving Vision Agent</h3>
  <input id="task" placeholder="e.g. fill out and submit the signup form" />
  <button id="run">Run agent</button>

  <div id="dashboard">
    <div class="metrics-grid" id="metrics-grid"></div>
    <div id="steps"></div>
    <div id="preview">
      <img id="preview-img" />
      <div id="preview-label">Redacted screenshot actually sent to the server (last step)</div>
    </div>
    <button id="export" style="margin-top: 8px; background: #2a2e38;">Export benchmark JSON</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
