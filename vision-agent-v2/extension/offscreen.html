<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vision inference (offscreen)</title>
</head>
<body>
  <!--
    This page is never shown to the user - Chrome renders offscreen
    documents in a hidden, unrendered context. Its only job is to be a
    real DOM environment (unlike the service worker) that ONNX Runtime
    Web's WASM backend can run in, since it needs dynamic import(), which
    the HTML spec disallows inside a ServiceWorkerGlobalScope but allows
    everywhere else, including here.
  -->
  <script type="module" src="offscreen.js"></script>
</body>
</html>
