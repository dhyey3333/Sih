<?xml version="1.0" encoding="UTF-8"?>
<!--
  A fake identity card, referenced as <img src>. FAKE DATA ONLY.

  This asset is the honest test of the whole architecture: every number below is
  rendered *inside* an image, so no amount of DOM scanning can find it. Only OCR
  over the pixels (M4) will, and until then this card is redacted as a whole
  region on the strength of its filename hint. Nothing on this card is real; the
  Aadhaar number is Verhoeff-valid so the validators fire on it once OCR reads it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" width="480" height="302" role="img"
     aria-label="Scanned identity card">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf4" />
      <stop offset="1" stop-color="#f3ece0" />
    </linearGradient>
  </defs>

  <rect width="480" height="302" rx="12" fill="url(#card)" stroke="#c9b99b" stroke-width="2" />
  <rect x="0" y="0" width="480" height="52" rx="12" fill="#c2410c" />
  <rect x="0" y="40" width="480" height="12" fill="#c2410c" />

  <text x="20" y="33" font-family="Georgia, serif" font-size="18" fill="#fff" font-weight="bold">
    GOVERNMENT OF INDIA
  </text>
  <text x="332" y="33" font-family="Georgia, serif" font-size="13" fill="#ffe8d6">SPECIMEN</text>

  <!-- photo box -->
  <rect x="20" y="72" width="104" height="126" fill="#dbe7f5" stroke="#b6c6dc" />
  <ellipse cx="72" cy="120" rx="26" ry="30" fill="#e7d3c2" />
  <path d="M32 198c0-24 18-38 40-38s40 14 40 38z" fill="#2f4a72" />
  <path d="M46 112c0-20 11-30 26-30s26 10 26 30c0-5-3-14-9-16-8 5-27 6-34-1-5 4-9 11-9 17z" fill="#2b2320" />

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2937">
    <text x="144" y="88" font-size="13" fill="#6b7280">Name</text>
    <text x="144" y="108" font-size="19" font-weight="bold">Ananya Iyer</text>

    <text x="144" y="136" font-size="13" fill="#6b7280">Date of Birth</text>
    <text x="144" y="156" font-size="17">14/03/2001</text>

    <text x="144" y="184" font-size="13" fill="#6b7280">Gender</text>
    <text x="144" y="204" font-size="17">Female</text>
  </g>

  <rect x="20" y="222" width="440" height="58" rx="6" fill="#fff7ed" stroke="#e7cba9" />
  <text x="40" y="252" font-family="Courier New, monospace" font-size="27" letter-spacing="5"
        fill="#111827" font-weight="bold">2234 5678 9018</text>
  <text x="40" y="271" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#92400e">
    आधार — आम आदमी का अधिकार · SPECIMEN, NOT A VALID DOCUMENT
  </text>
</svg>
