[project]
name = "privagent-eval"
version = "0.1.0"
description = "Metric harness. One command regenerates every number we report."
requires-python = ">=3.11"
dependencies = [
    # Drives a real browser so the harness measures the same code that ships,
    # rather than a reimplementation of it.
    "playwright>=1.48",
    # CPU time and memory of the browser process tree during a task: the part of
    # "client-side resource utilisation" that a download size does not measure.
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.ruff]
line-length = 100
